name: Sync to Hugging Face Space

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push to Hugging Face Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          set -eu
          if [ -z "$HF_TOKEN" ]; then
            echo "HF_TOKEN secret is not set on this repository."
            exit 1
          fi
          git remote add space "https://dansimpson61:${HF_TOKEN}@huggingface.co/spaces/dansimpson61/Comparator"
          git push space "HEAD:refs/heads/main" --force
